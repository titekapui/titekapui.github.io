<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#1a1a1a;--muted:#666;--line:#d5d8dd;--accent:#d93000}
body.night{--bg:#111;--panel:#1c1c1c;--text:#eee;--muted:#999;--line:#333;--accent:#ff4a1c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:1000}
.brand{font-weight:800;font-size:15px;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand i{color:var(--accent)}
.count{background:var(--accent);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--muted);padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button img{width:16px;height:12px;object-fit:cover;border-radius:2px;vertical-align:-1px;margin-right:3px}
.seg button.active{background:var(--accent);color:#fff}
#lang-seg button{padding:7px 10px}
#lang-seg button img{width:20px;height:15px;margin:0;vertical-align:middle;border-radius:2px;opacity:.55;transition:opacity .15s}
#lang-seg button:hover img,#lang-seg button.active img{opacity:1}
select,.icon-btn{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font-size:12px;padding:0 8px;cursor:pointer}
.icon-btn{width:34px;padding:0}
.icon-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.active:hover{color:#fff}
#map{flex:1;min-height:0}
/* kursor tanda tambah (+) di peta; tangan di atas titik api; tangan menggenggam saat peta digeser */
.leaflet-container,.leaflet-grab{cursor:crosshair}
.leaflet-container.leaflet-interactive,.leaflet-interactive{cursor:pointer}
.leaflet-dragging .leaflet-container,.leaflet-dragging .leaflet-grab{cursor:grabbing}
.locate{position:absolute;right:14px;bottom:28px;z-index:1000;width:46px;height:46px;border-radius:50%;border:1px solid var(--accent);background:var(--panel);color:var(--accent);box-shadow:0 3px 12px rgba(0,0,0,.3);cursor:pointer}
.legend{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.8}
.legend span.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--panel);border-left:5px solid var(--accent);padding:10px 16px;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.3);z-index:2000;font-size:12px;display:none}
.toast.show{display:block}
.popup-h{color:var(--accent);font-weight:800;font-size:12px;border-bottom:2px solid var(--accent);padding-bottom:4px}
.popup-t{width:100%;font-size:11px;border-collapse:collapse;margin-top:6px}
.popup-t td{padding:4px 0;border-bottom:1px dashed #ccc}
.marker-cluster div{background:var(--accent)!important;color:#fff;font-weight:800}
.marker-cluster{background:rgba(217,48,0,.2)!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:3000;display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal .box{background:var(--panel);max-width:520px;width:100%;max-height:85vh;overflow:auto;border-radius:10px;padding:22px;font-size:13px;line-height:1.7}
.modal h3{margin:0 0 10px;color:var(--accent)}
.modal .close{float:right;cursor:pointer;font-size:18px;color:var(--muted)}
.pulse{border-color:var(--accent)!important;animation:pulse 1s ease-out 5}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,48,0,.65)}100%{box-shadow:0 0 0 12px rgba(217,48,0,0)}}
.modal .sep{border:0;border-top:1px solid var(--line);margin:14px 0}
.credit-t{font-weight:800;font-size:15px;color:var(--accent)}
.modal .contact{margin:6px 0 0;font-size:12px}
.modal .contact a{color:var(--accent);text-decoration:none}
.modal .contact a:hover{text-decoration:underline}
.loadbar{position:relative;height:0;z-index:1100;pointer-events:none;opacity:0;transition:opacity .3s}
.loadbar.show{opacity:1}
.loadbar .track{position:absolute;top:0;left:0;right:0;height:4px;background:rgba(217,48,0,.15);overflow:hidden}
.loadbar .fill{height:100%;width:0;background:var(--accent);transition:width .25s ease-out;box-shadow:0 0 8px var(--accent)}
.loadbar .txt{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--panel);color:var(--text);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:700;box-shadow:0 3px 12px rgba(0,0,0,.25);white-space:nowrap}
.loadbar .txt i{color:var(--accent);margin-right:6px}
.dl-menu{position:fixed;z-index:2500;display:none;width:280px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.3);overflow:hidden}
.dl-menu.show{display:block}
.dl-menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--panel);color:var(--text);padding:10px 14px;font-size:13px;cursor:pointer;text-align:left}
.dl-menu button+button{border-top:1px solid var(--line)}
.dl-menu button:hover{background:var(--bg);color:var(--accent)}
.dl-menu button i{width:16px;color:var(--accent);text-align:center}
.dl-opt{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);cursor:pointer;background:var(--panel)}
.dl-body{padding:14px;display:flex;flex-direction:column;gap:10px}
.dl-body label{font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.dl-body select{width:100%;height:34px}
.dl-info{font-size:11px;color:var(--muted);line-height:1.5;min-height:34px}
.dl-menu .dl-go{justify-content:center;border:0;border-radius:8px;background:#16a05a;color:#fff;font-weight:700;font-size:13px;padding:10px;width:100%}
.dl-menu .dl-go:hover{background:#12894d;color:#fff}
.dl-menu .dl-go:disabled{opacity:.5;cursor:not-allowed}
.dl-menu .dl-go i{color:#fff}
.pin-icon{color:var(--accent);font-size:30px;text-shadow:0 1px 3px rgba(0,0,0,.5);text-align:center}
.share-row{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed #ccc}
.share-row button{width:32px;height:32px;border:0;border-radius:50%;color:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.share-row button:hover{filter:brightness(1.15);transform:scale(1.08)}
.sh-shot{background:#555}.sh-wa{background:#25D366}.sh-tg{background:#229ED9}
.sh-fb{background:#1877F2}.sh-x{background:#111}.sh-cp{background:#888}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
@media(max-width:600px){.brand span.t{display:none}}
</style>
</head>

    <p id="credit-c" style="margin:6px 0;font-weight:700"></p>
    <p class="contact">
      <a href="mailto:lonaliakbar@gmail.com">lonaliakbar@gmail.com</a><br>
      <a href="tel:+6285217707011">+62 852-1770-7011</a><br>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<script>
// Data titik api dibangun GitHub Actions (firms.yml) dan disimpan di branch "data"
const DATA_BASE = "https://raw.githubusercontent.com/titekapui/titekapui.github.io/data/firms/";
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);   // parameter tautan: ?maps=lat,lon,zoom&layer=...

const tr = {
  ace:{
    title:"MONITOR TITEK APUI",
    tipMap:"Peuta", tipSat:"Sateulit", tipDark:"Seupot", tipSmoke:"Citra Asap VIIRS/MODIS True Color",
    tipRegion:"Lokasi", tipSatSel:"Sateulit", allSat:"Bandum Sateulit",
    tipRefresh:"Seubaro", tipTheme:"Tema", tipInfo:"Info", tipLocate:"Lokasi Lon", tipShare:"Bagikan", shareCopied:"Tautan disalin", tipDl:"Unduh", noData:"Hana data nyang jeut ta unduh",
    geoOpt:"Sertakan nan teumpat (leubèh lama)", geoSea:"(di laot / hana alamat)", geoCancel:"Klik untuk batal",
    geoSkip:"{n} lokasi belum na nan teumpat. Unduh lom untuk neulanjut.", geoFail:"Layanan nan teumpat geutulak. Sabagian nan kosong.",
    legend:"Keuteurangan", high:"Confidence Manyang", low:"Confidence Reundah",
    detail:"DEUTAIL LOKASI", loc:"Mita nan lokasi...", noLoc:"Di laot / hana alamat", temp:"Suhu kecerahan", sat:"Sateulit", det:"Deuteksi", energy:"Energi (FRP)", time:"Update", coord:"Koordinat",
    err:"Data gadôh troh, cuba lom.", errLoc:"Gagal akses lokasi", errSmoke:"Citra satelit belum tersedia untuk tanggal ini",
    delPin:"Peuhah pin", zoomHere:"Zoom u teumpat nyoe", adm:"Wilayah",
    about:"Teuntang web nyoe",
    aboutText:"Sistem pantau titek apui nyoe datajih dari sateulit NASA FIRMS (VIIRS & MODIS) untuk deteksi tutong uteun ngon lahan, awai phon lon peugot khusuh untuk aceh jinoe data ka leungkap near real-time ban sigom donya"
  },
  id:{
    title:"MONITORING TITIK API",
    tipMap:"Peta", tipSat:"Satelit", tipDark:"Gelap", tipSmoke:"Citra Asap VIIRS/MODIS True Color",
    tipRegion:"Lokasi", tipSatSel:"Satelit", allSat:"Semua Satelit",
    tipRefresh:"Refresh", tipTheme:"Tema", tipInfo:"Info", tipLocate:"Lokasi saya", tipShare:"Bagikan tautan", shareCopied:"Tautan disalin", tipDl:"Unduh data", noData:"Tidak ada data untuk diunduh",
    geoOpt:"Sertakan nama tempat (lebih lama)", geoSea:"(di laut / tanpa alamat)", geoCancel:"Klik untuk batal",
    geoSkip:"{n} lokasi belum dicari nama tempatnya. Unduh lagi untuk melanjutkan.", geoFail:"Layanan nama tempat menolak permintaan. Sebagian nama kosong.",
    legend:"Keterangan", high:"Kepercayaan Tinggi", low:"Kepercayaan Rendah",
    detail:"DETAIL LOKASI", loc:"Mencari Lokasi...", noLoc:"Di laut / alamat tidak tersedia", temp:"Suhu kecerahan", sat:"Satelit", det:"Deteksi", energy:"Energi (FRP)", time:"Update", coord:"Koordinat",
    err:"Gagal memuat data, coba lagi.", errLoc:"Gagal akses lokasi", errSmoke:"Citra satelit belum tersedia untuk tanggal ini",
    delPin:"Hapus pin", zoomHere:"Zoom ke posisi ini", adm:"Wilayah",
    about:"Tentang Sistem",
    aboutText:"Sistem pemantauan titik api berbasis data satelit NASA FIRMS (VIIRS & MODIS) untuk deteksi dini kebakaran hutan dan lahan di Aceh. Data diperbarui berkala oleh NASA dan disajikan dalam peta interaktif yang mudah dibaca. Titik panas adalah deteksi panas oleh satelit, bukan kebakaran yang sudah terkonfirmasi (bisa juga flare migas atau industri). Data tertunda beberapa jam dan area berawan tidak terpantau."
  },
  en:{
    title:"HOTSPOT MONITORING",
    tipMap:"Map", tipSat:"Satellite", tipDark:"Dark", tipSmoke:"Smoke imagery VIIRS/MODIS True Color",
    tipRegion:"Location", tipSatSel:"Satellite", allSat:"All Satellites",
    tipRefresh:"Refresh", tipTheme:"Theme", tipInfo:"Info", tipLocate:"My location", tipShare:"Share link", shareCopied:"Link copied", tipDl:"Download data", noData:"No data to download",
    geoOpt:"Include place names (slower)", geoSea:"(at sea / no address)", geoCancel:"Click to cancel",
    geoSkip:"{n} locations have no place name yet. Download again to continue.", geoFail:"The place-name service refused requests. Some names are empty.",
    legend:"Legend", high:"High Confidence", low:"Low Confidence",
    detail:"LOCATION DETAIL", loc:"Locating...", noLoc:"At sea / no address available", temp:"Brightness temp", sat:"Satellite", det:"Detections", energy:"Power (FRP)", time:"Update", coord:"Coordinates",
    err:"Failed to load data, please retry.", errLoc:"Failed to access location", errSmoke:"Satellite imagery is not yet available for this date",
    delPin:"Remove pin", zoomHere:"Zoom to this position", adm:"Region",
    about:"About",
    aboutText:"A hotspot monitoring system using NASA FIRMS satellite data (VIIRS & MODIS) for early detection of forest and land fires in Aceh. Data is refreshed periodically by NASA and shown on an easy-to-read interactive map. A hotspot is a satellite heat detection, not a confirmed fire (it may also be an oil & gas flare or industry). Data lags by a few hours and cloudy areas are not observed."
  }
};
const credit = {
  ace:{t:"Geupeugöt di Gampong Cot Mesjid", p:"Titek Apui Monitor geupeugöt le Ali Akbar, Gampong Cot Mesjid, Samatiga, Aceh Barat.", c:"Na saran? Hubungi lon."},
  id:{t:"Dibuat dari Cot Mesjid untuk Aceh", p:"Titek Apui Monitor dikembangkan oleh Ali Akbar, Gampong Cot Mesjid, Samatiga, Aceh Barat.", c:"Punya masukan? Hubungi saya."},
  en:{t:"Made in Cot Mesjid, for Aceh", p:"Titek Apui Monitor is developed by Ali Akbar, Gampong Cot Mesjid, Samatiga, West Aceh.", c:"Have feedback? Contact me."}
};
let lang = 'ace', userMarker, toastTimer;
const FIRE_COLOR = '#e74c3c';   // satu warna untuk semua titik api (NASA & Himawari); ubah di sini bila ingin warna lain

// ---------- MAP ----------
const layers = {
  street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {crossOrigin:true, attribution:'<a href="https://tiktok.com/lonaliakbar">@lonaliakbar</a> | © OpenStreetMap'}),
  sat: L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {crossOrigin:true, maxZoom:19, attribution:'Esri, Maxar, Earthstar Geographics'}),
    // nama tempat, batas wilayah & jalan; pane khusus agar tampil di atas citra asap
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {crossOrigin:true, maxNativeZoom:13, maxZoom:19, pane:'labelPane'})
  ]),
  dark: L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {crossOrigin:true, maxNativeZoom:16, maxZoom:19, zIndex:1, attribution:'Esri, HERE, Garmin, © OpenStreetMap contributors'}),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {crossOrigin:true, maxNativeZoom:16, maxZoom:19, zIndex:2})
  ])
};
// Batas seluruh Indonesia (Sabang sampai Merauke). fitBounds menyesuaikan zoom dengan ukuran layar,
// jadi seluruh Indonesia selalu terlihat di HP maupun layar lebar.
const INDONESIA_BOUNDS = L.latLngBounds([-11.5, 94.5], [6.5, 141.5]);
const map = L.map('map', {zoomControl:false, preferCanvas:true, layers:[layers.street]});
const START_BOUNDS = L.latLngBounds([-9.5, 94.5], [6.5, 126]);   // tampilan awal: Sumatera sampai Sulawesi
map.fitBounds(START_BOUNDS, {maxZoom:6});
L.control.zoom({position:'topright'}).addTo(map);
map.createPane('labelPane');
map.getPane('labelPane').style.zIndex = 350;   // di atas citra asap (300), di bawah titik api (400)
map.getPane('labelPane').style.pointerEvents = 'none';

let currentBase = 'street';
function setBase(name){
  setSmoke(false);   // keluar dari mode asap saat ganti peta dasar
  map.removeLayer(layers[currentBase]);
  layers[name].addTo(map);
  currentBase = name;
  syncUrl();
  document.querySelectorAll('#map-seg button').forEach(b => b.classList.toggle('active', b.dataset.map === name));
}

const fireLayer = L.markerClusterGroup({
  maxClusterRadius:50, disableClusteringAtZoom:12, spiderfyOnMaxZoom:false, showCoverageOnHover:false,
  iconCreateFunction:c => L.divIcon({html:`<div><span>${c.getChildCount()}</span></div>`, className:'marker-cluster', iconSize:L.point(40,40)})
});
map.addLayer(fireLayer);

// Titik api di dalam Aceh TIDAK di-cluster: sekecil apa pun selalu tampil satu per satu di semua level zoom.
// Wilayah lain tetap memakai cluster.
const acehLayer = L.layerGroup().addTo(map);

const ACEH_POLYS = [

  [[1.95,97.00],[2.55,97.00],[2.55,97.70],[1.95,97.70]]    // Kep. Banyak
];
function pointInPoly(lat, lon, poly){
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [yi, xi] = poly[i], [yj, xj] = poly[j];
    if (((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
const inAceh = (lat, lon) => ACEH_POLYS.some(p => pointInPoly(lat, lon, p));

// Area hitam di citra = celah antar-lintasan satelit (tidak ada data hari itu).

const GibsTransparent = L.TileLayer.extend({
  createTile(coords, done){
    const size = this.getTileSize();
    const tile = document.createElement('canvas');
    tile.width = size.x; tile.height = size.y;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const ctx = tile.getContext('2d', {willReadFrequently:true});
      ctx.drawImage(img, 0, 0, size.x, size.y);
      try {
        const id = ctx.getImageData(0, 0, size.x, size.y), p = id.data;
        for (let i = 0; i < p.length; i += 4) {
          const m = Math.max(p[i], p[i+1], p[i+2]);
          if (m < 14) p[i+3] = 0;                                   // hitam = tidak ada data
          else if (m < 30) p[i+3] = Math.round((m - 14) / 16 * 255); // tepi dihaluskan
        }
        ctx.putImageData(id, 0, 0);
      } catch(e) { /* CORS gagal: tile tampil apa adanya */ }
      done(null, tile);
    };
    img.onerror = () => done(new Error('tile'), tile);
    img.src = this.getTileUrl(coords);
    return tile;
  }
});
function gibsLayer(layerName){
  return new GibsTransparent(
    `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${layerName}/default/${smokeDate}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`,
    {maxNativeZoom:9, maxZoom:19, pane:'smokePane', attribution:'NASA GIBS'}
  );
}

// urutan: yang paling atas = resolusi terbaik (VIIRS), yang bawah menambal celah

// Marker Himawari memakai canvas yang sama dengan titik NASA (tanpa pane khusus),
// supaya klik sampai ke marker. Urutan gambar diatur lewat bringToBack().
const hwLayer = L.layerGroup();
let hwData = null, hwShown = 0, hwBusy = false;
const hwWib = ms => new Date(ms + 7*3600e3).toISOString();

async function loadHimawari(){
  if (hwBusy) return;
  hwBusy = true; loadStart('upd');
  try {
    const stamp = '?t=' + Math.floor(Date.now() / 300000);
    let r = null;
    try { r = await fetch(HIMAWARI_WILAYAH_URL + stamp); if (!r.ok) r = null; } catch(e) { r = null; }
    if (!r) r = await fetch(HIMAWARI_URL + stamp);   // cadangan: tanpa nama wilayah
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json(), base = Date.parse(j.base);
    if (!Number.isFinite(base) || !Array.isArray(j.data)) throw new Error('format');
    let max = 0;
    const pts = [];
    j.data.forEach(([lon, lat, frp, n, hrs, place]) => {
      if (!Number.isFinite(lon) || !Number.isFinite(lat) || !Array.isArray(hrs) || !hrs.length) return;
      const last = hrs[hrs.length - 1];
      if (last > max) max = last;
      pts.push({lon, lat, frp, n, hrs, last, place});
    });
    hwData = {base, max, pts};
    renderHimawari();
  } catch(e) { console.error(e); showError(tr[lang].hwErr); }
  finally { hwBusy = false; loadDone(); }
}

// Nama wilayah (kabupaten/kota, provinsi) titik Himawari dicari saat popup dibuka, lewat OpenStreetMap Nominatim.
// Hasil disimpan per sel ±1 km, jadi titik yang sama tidak diminta dua kali.
const hwPlaceCache = new Map();
function hwPlace(p){
  const key = p.lat.toFixed(2) + '|' + p.lon.toFixed(2);
  const show = raw => { const el = $('hw-place'); if (el) el.innerText = raw || tr[lang].noLoc; centerOnPopup(); };
  if (hwPlaceCache.has(key)) { setTimeout(() => show(hwPlaceCache.get(key)), 0); return; }
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&addressdetails=1&accept-language=id&lat=${p.lat}&lon=${p.lon}`)
    .then(r => r.json())
    .then(j => {
      const a = j.address || {};
      const kab = a.county || a.city || a.municipality || a.regency || a.town || a.state_district || '';
      const raw = [kab, a.state].filter(Boolean).join(', ');   // kosong bila di laut / tanpa alamat
      hwPlaceCache.set(key, raw);
      show(raw);
    })
    .catch(() => show(''));
}

// Kategori ukuran api dari nilai FRP (MW): <10 kecil, 10-50 sedang, >=50 besar
const hwSizeLabel = frp => { const t = tr[lang], v = +frp || 0; return v < 10 ? t.sizeS : v < 50 ? t.sizeM : t.sizeL; };

// Baris wilayah: dari data Actions bila ada ([desa, kecamatan, kabupaten, provinsi]); kalau belum ada, cari lewat Nominatim
function hwPlaceRows(p){
  const t = tr[lang];
  if (!Array.isArray(p.place)) { hwPlace(p); return `<tr><td>${t.adm}</td><td align="right" id="hw-place">${t.loc}</td></tr>`; }
  const rows = [[t.hwDesa, p.place[0]], [t.hwKec, p.place[1]], [t.hwKab, p.place[2]], [t.hwProv, p.place[3]]].filter(r => r[1]);
  if (!rows.length) return `<tr><td>${t.adm}</td><td align="right">${t.noLoc}</td></tr>`;
  return rows.map(([k, v]) => `<tr><td>${k}</td><td align="right">${xmlEsc(v)}</td></tr>`).join('');
}

function hwPopup(p, from){
  const t = tr[lang], w = hwWib(hwData.base + p.last * 3600e3);
  const tgl = w.slice(8,10) + '/' + w.slice(5,7), jam = w.slice(11,13);
  const inRange = p.hrs.filter(h => h >= from).length;
  return `<div style="min-width:230px">
    <div class="popup-h">${t.hwTitle}</div>
    <table class="popup-t">
      ${hwPlaceRows(p)}
      <tr><td>${t.energy}</td><td align="right">${(+p.frp || 0).toFixed(1)} MW</td></tr>
      <tr><td>${t.hwSize}</td><td align="right"><b>${hwSizeLabel(p.frp)}</b></td></tr>
      <tr><td>${t.hwLast}</td><td align="right">${tgl}, ${jam}:00–${jam}:59 WIB</td></tr>
      <tr><td>${t.hwHours}</td><td align="right">${inRange}</td></tr>
      <tr><td>${t.det}</td><td align="right">${p.n}×</td></tr>
      <tr><td>${t.coord}</td><td align="right">${p.lat.toFixed(3)}, ${p.lon.toFixed(3)}</td></tr>
      <tr><td colspan="2" style="padding-top:8px;border-bottom:0"><a href="https://www.google.com/maps?q=${p.lat},${p.lon}" target="_blank" rel="noopener" style="color:#d93000;font-weight:700;text-decoration:none">📍 Google Maps</a><br><a href="#" onclick="zoomTo(${p.lat},${p.lon});return false" style="color:#d93000;font-weight:700;text-decoration:none;display:inline-block;margin-top:4px">🔍 ${t.zoomHere}</a></td></tr>
    </table>
    <div style="font-size:10px;color:#777;margin-top:6px">${t.hwNote}</div></div>`;
}

function renderHimawari(){
  hwLayer.clearLayers(); hwShown = 0;
  if (hwData) {
    const nowH = Math.floor((Date.now() - hwData.base) / 3600e3);   // jam sekarang, relatif ke base
    const from = nowH - (parseInt($('hw-sel').value) || 12) + 1;    // jendela jam terakhir dari waktu sekarang
    hwData.pts.forEach(p => {
      if (p.last < from) return;
      hwShown++;
      L.circleMarker([p.lat, p.lon], {radius:Math.min(4 + Math.sqrt(+p.frp || 0) * 1.1, 14), fillColor:FIRE_COLOR, color:'#fff', weight:1.5, fillOpacity:0.75})
        .bindPopup(() => hwPopup(p, from)).addTo(hwLayer);
    });
    hwLayer.eachLayer(l => l.bringToBack());   // di bawah titik NASA, tetap bisa diklik
  }
  if ($('sat-sel').value === 'himawari') $('count-val').innerText = hwShown;   // mode Himawari saja: hitung titik Himawari
  renderLegend();
}

function setHimawari(on){
  if (on === map.hasLayer(hwLayer)) return;
  if (on) { hwLayer.addTo(map); if (hwData) renderHimawari(); else loadHimawari(); }
  else { map.removeLayer(hwLayer); renderLegend(); }
  syncUrl();
}
// Himawari mengikuti pilihan di dropdown satelit: 'himawari' = hanya Himawari, 'all_hw' = semua NASA + Himawari
function syncHw(){ const v = $('sat-sel').value; setHimawari(v === 'himawari' || v === 'all_hw'); renderLegend(); }
$('hw-sel').onchange = () => { renderHimawari(); fetchData(false); syncUrl(); };   // rentang waktu berlaku untuk NASA & Himawari

// ---------- POPUP: otomatis ke tengah layar ----------
L.Popup.mergeOptions({autoPan:false});   // matikan autopan bawaan, diganti centering sendiri
let openPopup = null, currentShare = null;

function centerOnPopup(){
  if (!openPopup || !openPopup._container) return;
  const h = openPopup._container.offsetHeight + 20;            // tinggi popup + ujung panah
  const p = map.project(openPopup.getLatLng());
  p.y -= h / 2;                                                 // titik api + popup jadi satu kesatuan di tengah
  map.panTo(map.unproject(p), {animate:true, duration:0.5});
}
map.on('popupopen',  e => { openPopup = e.popup; centerOnPopup(); });
map.on('popupclose', () => { openPopup = null; });

const pointUrl = (lat, lon) =>
  `${location.origin}${location.pathname}?maps=${lat.toFixed(5)},${lon.toFixed(5)},15&pin=${lat.toFixed(5)},${lon.toFixed(5)}&lang=${lang}`;

let h2cPromise;
function ensureH2C(){
  if (typeof html2canvas !== 'undefined') return Promise.resolve();
  return h2cPromise || (h2cPromise = new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = ok; s.onerror = () => { h2cPromise = null; fail(new Error('html2canvas')); };
    document.head.appendChild(s);
  }));
}
async function shotMap(){
  try {
    await ensureH2C();
    const canvas = await html2canvas($('map'), {
      useCORS:true, logging:false, scale: Math.min(window.devicePixelRatio || 1, 2),
      onclone: doc => doc.querySelectorAll('.share-row,.leaflet-control-zoom,.leaflet-popup-close-button')
                         .forEach(el => el.style.display = 'none')
    });
    canvas.toBlob(async blob => {
      const name = `titik-api_${Date.now()}.png`;
      const file = new File([blob], name, {type:'image/png'});
      if (/Mobi|Android/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[file]})) {
        try { await navigator.share({files:[file], title:document.title}); return; }
        catch(e) { if (e.name === 'AbortError') return; }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  } catch(e) { console.error(e); showError('Gagal membuat screenshot.'); }
}
function shareTo(kind){
  if (kind === 'shot') return shotMap();
  if (!currentShare) return;
  const {lat, lon, txt} = currentShare, url = pointUrl(lat, lon);
  const T = encodeURIComponent(txt), U = encodeURIComponent(url);
  const go = {
    wa: `https://wa.me/?text=${encodeURIComponent(txt + '\n' + url)}`,
    tg: `https://t.me/share/url?url=${U}&text=${T}`,
    fb: `https://www.facebook.com/sharer/sharer.php?u=${U}`,
    x:  `https://twitter.com/intent/tweet?text=${T}&url=${U}`
  }[kind];
  if (go) { window.open(go, '_blank', 'noopener'); return; }
  navigator.clipboard.writeText(txt + '\n' + url)
    .then(() => showError(tr[lang].shareCopied))
    .catch(() => prompt('Salin tautan:', url));
}

function buildShareUrl(){
  const c = map.getCenter(), parts = [`maps=${c.lat.toFixed(5)},${c.lng.toFixed(5)},${map.getZoom()}`];
  if (currentBase !== 'street') parts.push('layer=' + currentBase);
  if (map.hasLayer(smokeLayer)) parts.push('smoke=1');
  if ($('hw-sel').value !== '12') parts.push('jam=' + $('hw-sel').value);
  if ($('region-sel').value !== 'indonesia') parts.push('region=' + $('region-sel').value);
  if ($('sat-sel').value !== 'all') parts.push('sat=' + $('sat-sel').value);
  if (pinLL) parts.push(`pin=${pinLL[0].toFixed(5)},${pinLL[1].toFixed(5)}`);
  parts.push('lang=' + lang);
  if (document.body.classList.contains('night')) parts.push('theme=night');
  return location.origin + location.pathname + '?' + parts.join('&');
}
function syncUrl(){   // address bar ikut berubah, jadi menyalin alamat dari browser sudah cukup
  clearTimeout(urlTimer);
  urlTimer = setTimeout(() => { try { history.replaceState(null, '', buildShareUrl()); } catch(e){} }, 400);
}
map.on('moveend', syncUrl);
function applyUrlParams(){
  const opt = (id, v) => v && [...$(id).options].some(o => o.value === v);
  const valid = (la, lo) => Number.isFinite(la) && Number.isFinite(lo) && Math.abs(la) <= 90 && Math.abs(lo) <= 180;
  if (layers[Q.get('layer')]) setBase(Q.get('layer'));
  if (Q.get('smoke') === '1') setSmoke(true);
  if (opt('sat-sel', Q.get('sat'))) $('sat-sel').value = Q.get('sat');
  if (opt('hw-sel', Q.get('jam'))) $('hw-sel').value = Q.get('jam');
  if (Q.get('hw')) {
    if (opt('hw-sel', Q.get('hw'))) $('hw-sel').value = Q.get('hw');
    if (!['himawari', 'all_hw'].includes($('sat-sel').value)) $('sat-sel').value = 'all_hw';   // tautan lama ?hw=
  }
  syncHw();
  if (opt('region-sel', Q.get('region'))) $('region-sel').value = Q.get('region');
  const m = (Q.get('maps') || '').split(',').map(Number);
  const p = (Q.get('pin') || '').split(',').map(Number);
  // validasi: siapa pun bisa mengetik apa saja di URL
  const mapsOk = m.length >= 2 && valid(m[0], m[1]);
  const pinOk = p.length >= 2 && valid(p[0], p[1]);
  if (mapsOk) {
    const z = Number.isFinite(m[2]) && m[2] >= 1 && m[2] <= 19 ? Math.round(m[2]) : 12;
    map.setView([m[0], m[1]], z);
  } else if (pinOk) {
    map.setView([p[0], p[1]], 14);     // hanya pin tanpa maps: pusatkan ke pin
  } else if (Q.get('region') === 'aceh') map.setView([4.3, 96.8], 8);
  else if (Q.get('region') === 'global') map.setView([10, 100], 3);

  if (pinOk) setPin(p[0], p[1], false);
  else if (Q.get('pin') === '1' && mapsOk) setPin(m[0], m[1], false);   // kompatibel dengan tautan lama
}

// Nama tempat sudah dihitung server (Google Script + Spreadsheet) dan ikut di data: kolom Kabupaten/Kota & Provinsi.
function labelsOf(r){
  const prov = r['Provinsi'], kab = r['Kabupaten/Kota'];
  if (!prov && !kab) return null;                       // belum diproses server
  if (prov === SEA) return {prov: SEA, kab: ''};
  return {prov: prov || '(Tanpa nama provinsi)', kab: kab || '(Tanpa nama kabupaten)'};
}
function fillSelect(sel, label, counts, total){
  const cur = sel.value;
  sel.innerHTML = '';
  const add = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); };
  add('', `${label} (${total})`);
  [...counts.keys()].sort((a, b) => a.localeCompare(b, 'id')).forEach(k => add(k, `${k} (${counts.get(k)})`));
  sel.value = counts.has(cur) ? cur : '';
}
function dlSelected(){
  const pv = $('dl-prov').value, kb = $('dl-kab').value;
  return dlRows.filter(r => { if (!pv) return true; const l = labelsOf(r); return l && l.prov === pv && (!kb || l.kab === kb); });
}
function refreshDl(status){
  if (status !== undefined) dlStatus = status;
  const pc = new Map(), kc = new Map(), pv = $('dl-prov').value;
  dlRows.forEach(r => {
    const l = labelsOf(r); if (!l) return;
    pc.set(l.prov, (pc.get(l.prov) || 0) + 1);
    if (pv && l.prov === pv && l.kab) kc.set(l.kab, (kc.get(l.kab) || 0) + 1);
  });
  fillSelect($('dl-prov'), 'Semua Provinsi', pc, dlRows.length);
  fillSelect($('dl-kab'), 'Semua Kabupaten/Kota', kc, pc.get($('dl-prov').value) || 0);
  $('dl-kab').disabled = !$('dl-prov').value || !kc.size;
  const n = dlSelected().length, unk = dlRows.filter(r => !labelsOf(r)).length;
  $('dl-info').innerHTML = `Titik diunduh: <b>${n}</b> dari ${dlRows.length}` + (dlStatus ? `<br>${dlStatus}` : '') + (unk ? `<br>${unk} titik belum ada nama tempatnya (sedang diproses server).` : '');
  $('dl-go').disabled = !n;
}

const XL_W = {'No':6, 'Tanggal':12, 'Jam (WIB)':10, 'Latitude':11, 'Longitude':11, 'Desa/Kelurahan':24, 'Kecamatan':18, 'Kabupaten/Kota':20, 'Provinsi':18, 'Satelit':20, 'Kepercayaan':13, 'Energi (MW)':12, 'Suhu (°C)':10, 'Jumlah Deteksi':11, 'Wilayah':12, 'Google Maps':13};
const XL_NUM = {'Latitude':'0.0000', 'Longitude':'0.0000', 'Energi (MW)':'0.0', 'Suhu (°C)':'0.0', 'No':'0', 'Jumlah Deteksi':'0'};

  ws.columns = cols.map(c => ({key:c, width: XL_W[c] || 14}));
  const last = ws.getColumn(n).letter, F = a => ({type:'pattern', pattern:'solid', fgColor:{argb:a}});
  const band = (r, text, o) => { ws.mergeCells(`A${r}:${last}${r}`); const c = ws.getCell(`A${r}`); c.value = text; Object.assign(c, {font:o.font, fill:F(o.bg), alignment:{vertical:'middle', horizontal:'left', indent:1}}); ws.getRow(r).height = o.h; };
  const wib = new Date(Date.now() + 7*3600e3).toISOString().slice(0,16).replace('T', ' ');

  band(2, 'Sumber data: NASA FIRMS (VIIRS & MODIS)  |  Titek Apui Monitor', {font:{name:'Calibri', size:10, italic:true, color:{argb:'FF555555'}}, bg:'FFF3F4F6', h:20});
  const info = {font:{name:'Calibri', size:11, color:{argb:'FF1A1A1A'}}, bg:'FFFFFFFF', h:19};

  band(4, `Satelit  :  ${$('sat-sel').selectedOptions[0].text}      |      Jumlah titik  :  ${rows.length}`, info);
  band(5, `Diunduh  :  ${wib} WIB`, info);
  const bd = (a, w) => ({style:'thin', color:{argb:a}});
  const hr = ws.getRow(HR); hr.height = 30;
  cols.forEach((c, i) => {
    const cell = hr.getCell(i + 1);
    cell.value = c;
    cell.font = {name:'Calibri', size:11, bold:true, color:{argb:'FFFFFFFF'}};
    cell.fill = F('FF1F2937');
    cell.alignment = {vertical:'middle', horizontal:'center', wrapText:true};
    cell.border = {top:bd('FF1F2937'), left:bd('FF4B5563'), right:bd('FF4B5563'), bottom:{style:'medium', color:{argb:'FFD93000'}}};
  });
  for (let ri = 0; ri < rows.length; ri++) {
    const r = rows[ri];
    const row = ws.getRow(HR + 1 + ri); row.height = 18;
    if (ri % 150 === 0) {
      setLoadVal(10 + 78 * ri / rows.length);
      $('load-txt').innerText = `${LOAD_TXT.xls[lang]}... ${Math.round(100 * ri / rows.length)}%`;
      await new Promise(res => setTimeout(res, 0));
    }
    cols.forEach((c, i) => {
      const cell = row.getCell(i + 1);
      cell.value = c === 'Google Maps' ? {text:'Buka peta', hyperlink:r[c]} : r[c];
      cell.font = c === 'Google Maps' ? {name:'Calibri', size:10, color:{argb:'FF0563C1'}, underline:true} : {name:'Calibri', size:10};
      if (ri % 2) cell.fill = F('FFFAF5F2');

    });
  }
  const end = HR + rows.length;
  ws.autoFilter = {from:{row:HR, column:1}, to:{row:HR, column:n}};
  const fr = end + 2;
  ws.mergeCells(`A${fr}:${last}${fr}`);

  fc.font = {name:'Calibri', size:9, italic:true, color:{argb:'FF666666'}};

  saveFile(`titik-api_${slug}_${wib.slice(0,10).replace(/-/g, '')}.xlsx`, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', buf);

function radiusFromFRP(frp){
  const v = parseFloat(frp) || 0;
  return Math.min(Math.max(6 + Math.sqrt(v) * 1.6, 6), 22);
}

// Aceh & Indonesia dimuat di awal dan disimpan di memori. Global TIDAK dimuat otomatis:
// baru diminta ke server saat dipilih (server membangunnya saat itu juga lalu menyimpan cache 1 jam).
// Ganti lokasi / satelit hanya menyaring data yang sudah ada, tanpa memuat ulang dari API.
const REGIONS = ['aceh', 'indonesia'];
const SAT_NAME = {suomi_npp:'Suomi NPP', noaa20:'NOAA-20', noaa21:'NOAA-21', terra_aqua:'Terra/Aqua (MODIS)'};
const SAT_MATCH = {suomi_npp:['N'], noaa20:['1','J1','N20'], noaa21:['2','J2','N21'], terra_aqua:['T','A']};
const store = {};   // wilayah -> Promise<{rows} | {error}>
let renderToken = 0;

// ---- Cache IndexedDB: data terakhir disimpan di perangkat, jadi kunjungan berikutnya langsung tampil ----
const CACHE_MAX_AGE = 3 * 24 * 3600 * 1000;   // cache lebih tua dari 3 hari tidak dipakai (data segar tetap diambil di latar belakang)
const IDB = new Promise(res => {
  try {
    const q = indexedDB.open('titekapui', 2);
    q.onupgradeneeded = () => {
      ['raw', 'geo'].forEach(n => { if (!q.result.objectStoreNames.contains(n)) q.result.createObjectStore(n); });
    };
    q.onsuccess = () => res(q.result);
    q.onerror = () => res(null);
  } catch(e) { res(null); }
});
async function cacheGet(k){
  const db = await IDB; if (!db) return null;
  return new Promise(res => {
    try {
      const r = db.transaction('raw').objectStore('raw').get('v3:' + k);
      r.onsuccess = () => { const v = r.result; res(v && Date.now() - v.t < CACHE_MAX_AGE ? v.raw : null); };
      r.onerror = () => res(null);
    } catch(e) { res(null); }
  });
}
async function cacheSet(k, raw){
  const db = await IDB; if (!db) return;
  try { db.transaction('raw', 'readwrite').objectStore('raw').put({t: Date.now(), raw}, 'v3:' + k); } catch(e) {}
}
function parseRaw(raw){
  const t = raw.trim();
  if (t.startsWith('{')) {
    try { const e = JSON.parse(t); if (e && e.error) return {error: e.message}; } catch(_){}
  }
  const res = Papa.parse(raw, {header:true, dynamicTyping:true, skipEmptyLines:true});
  return {rows: res.data};
}
// ambil dari server (dan simpan ke cache bila berhasil), tanpa menyentuh store
function fetchRegion(r){
  return (async () => {
    const get = async () => {
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 60000);
      try {
        const res = await fetch(`${DATA_BASE}${r}.csv?t=${Math.floor(Date.now() / 300000)}`, {signal: ctl.signal});
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.text();
      } finally { clearTimeout(to); }
    };
    let raw; try { raw = await get(); } catch(e) { raw = await get(); }   // coba ulang sekali
    const out = parseRaw(raw);
    if (out.rows && out.rows.length) cacheSet(r, raw);
    return out;
  })().catch(e => { console.error(e); return {error: null}; });
}
function loadRegion(r){ return store[r] = fetchRegion(r); }

  try {
    if (force) {
      // refresh manual: muat ulang wilayah aktif dulu, lalu sisanya di latar belakang
      const first = region === 'aceh' ? [loadRegion('aceh')] : [loadRegion('aceh'), loadRegion(region)];
      Promise.all(first).then(() => REGIONS.filter(r => r !== 'aceh' && r !== region).forEach(loadRegion));
    }
    // Data Aceh selalu ikut ditampilkan, apa pun lokasi yang dipilih,
    // supaya titik api di Aceh tidak hilang saat peta di-zoom out / pindah ke mode Indonesia atau Global.
    const [acehData, regionData] = await Promise.all([
      store.aceh || loadRegion('aceh'),
      region === 'aceh' ? null : (store[region] || loadRegion(region))
    ]);
    if (token !== renderToken) return; // sudah ada permintaan yang lebih baru
    setLoadText('draw');
    await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));   // beri waktu browser menggambar teks status
    if (token !== renderToken) return;
    const sources = region === 'aceh' ? [acehData] : [acehData, regionData];
    const failed = sources.filter(src => src.rows === undefined);
    if (failed.length === sources.length) {
      showError(failed[0].error || undefined);
      fireLayer.clearLayers(); acehLayer.clearLayers(); $('count-val').innerText = 0; lastRows = [];
      return;
    }
    const rowsAll = sources.flatMap(src => src.rows || []);

    const allow = SAT_MATCH[sat];
    const cutoff = Date.now() - (parseInt($('hw-sel').value) || 12) * 3600e3;   // rentang waktu terpilih
    fireLayer.clearLayers(); acehLayer.clearLayers();
    const seen = new Set(), markers = [], exportRows = [];

    rowsAll.forEach((d, i) => {
      if (typeof d.latitude !== 'number' || typeof d.longitude !== 'number') return; // lewati baris komentar/rusak
      // kolom waktu acq_date + acq_time (UTC): sembunyikan titik yang lebih lama dari rentang waktu
      const tu = String(d.acq_time).padStart(4, '0'), tMs = Date.parse(`${d.acq_date}T${tu.slice(0,2)}:${tu.slice(2,4)}:00Z`);
      if (Number.isFinite(tMs) && tMs < cutoff) return;
      // Format baru backend: kolom "satelit" berisi daftar gabungan, mis. "suomi_npp+noaa20"
      // Format lama: kolom "satellite" berisi kode satu huruf (T/A/N/1/2)
      const satKeys = d.satelit ? String(d.satelit).split('+') : null;
      const s = String(d.satellite);
      if (sat !== 'all') {
        if (satKeys) { if (!satKeys.includes(sat)) return; }
        else if (allow && !allow.includes(s)) return;
      }
      const key = `${d.latitude.toFixed(4)}|${d.longitude.toFixed(4)}`;
      if (seen.has(key)) return;
      seen.add(key);

      const ts = String(d.acq_time).padStart(4, '0');
      const dt = new Date(d.acq_date);
      dt.setUTCHours(parseInt(ts.slice(0,2)) + 7);
      dt.setUTCMinutes(parseInt(ts.slice(2,4)));

      let satName = "VIIRS";
      if (satKeys) satName = satKeys.map(k => SAT_NAME[k] || k).join(' + ');
      else if (s === 'T') satName = "Terra (MODIS)";
      else if (s === 'A') satName = "Aqua (MODIS)";
      else if (s === 'N') satName = "Suomi NPP";
      else if (s === '1' || s === 'J1') satName = "NOAA-20";
      else if (s === '2' || s === 'J2') satName = "NOAA-21";

      const color = FIRE_COLOR;
      const m = L.circleMarker([d.latitude, d.longitude], {radius:radiusFromFRP(d.frp), fillColor:color, color:'#fff', weight:2, fillOpacity:0.9});
      const tb = d.bright_ti4 || d.bright_t31;
      const det = d.jumlah_deteksi;

      m.bindPopup(() => {
        const t = tr[lang], id = "loc-" + i;
        // format waktu hanya dihitung saat popup dibuka (lebih ringan untuk ribuan titik)
        const wibTime = dt.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', timeZone:'UTC'}) + " WIB";
        const wibDate = dt.toLocaleDateString('id-ID', {day:'2-digit', month:'short', timeZone:'UTC'});
        const tempRow = tb ? `<tr><td>${t.temp}</td><td align="right">${(tb - 273.15).toFixed(1)} °C</td></tr>` : '';
        const detRow = det ? `<tr><td>${t.det}</td><td align="right">${det}×</td></tr>` : '';
        // kabupaten & provinsi dari server (Google Script + Spreadsheet); kosong bila sel belum diproses server
        const admTxt = [d.kabupaten, d.provinsi].filter(Boolean).join(', ');
        const admRow = admTxt ? `<tr><td>${t.adm}</td><td align="right">${xmlEsc(admTxt)}</td></tr>` : '';
        currentShare = {
          lat: d.latitude, lon: d.longitude,
          txt: `🔥 Titik api${admTxt ? ' di ' + admTxt : ''}\n📍 ${d.latitude.toFixed(4)}, ${d.longitude.toFixed(4)}\n🕑 ${wibDate}, ${wibTime}\n🛰️ ${satName} • ${(+d.frp || 0).toFixed(1)} MW`
        };
        // Nama lokasi: titik di laut tidak punya alamat, jadi tampilkan teks "di laut" (bukan loading terus)
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${d.latitude}&lon=${d.longitude}`)
          .then(r => r.json())
          .then(j => { const el = $(id); if (el) el.innerText = j.display_name || t.noLoc; centerOnPopup(); })
          .catch(() => { const el = $(id); if (el) el.innerText = t.noLoc; centerOnPopup(); });
        return `<div style="min-width:235px">
          <div class="popup-h">${t.detail}</div>
          <div id="${id}" style="font-size:10px;color:#777;margin:6px 0">${t.loc}</div>
          <table class="popup-t">
            ${admRow}
            <tr><td>${t.sat}</td><td align="right"><b>${satName}</b></td></tr>
            ${tempRow}
            ${detRow}
            <tr><td>${t.energy}</td><td align="right">${(+d.frp || 0).toFixed(1)} MW</td></tr>
            <tr><td>${t.time}</td><td align="right">${wibDate}, ${wibTime}</td></tr>
            <tr><td>${t.coord}</td><td align="right">${d.latitude.toFixed(3)}, ${d.longitude.toFixed(3)}</td></tr>
            <tr><td colspan="2" style="padding-top:8px;border-bottom:0"><a href="https://www.google.com/maps?q=${d.latitude},${d.longitude}" target="_blank" rel="noopener" style="color:#d93000;font-weight:700;text-decoration:none">📍 Google Maps</a><br><a href="#" onclick="zoomTo(${d.latitude},${d.longitude});return false" style="color:#d93000;font-weight:700;text-decoration:none;display:inline-block;margin-top:4px">🔍 ${t.zoomHere}</a></td></tr>
          </table>
          <div class="share-row">
            <button class="sh-shot" title="Screenshot" onclick="shareTo('shot')"><i class="fas fa-camera"></i></button>
            <button class="sh-wa" title="WhatsApp" onclick="shareTo('wa')"><i class="fa-brands fa-whatsapp"></i></button>
            <button class="sh-tg" title="Telegram" onclick="shareTo('tg')"><i class="fa-brands fa-telegram"></i></button>
            <button class="sh-fb" title="Facebook" onclick="shareTo('fb')"><i class="fa-brands fa-facebook-f"></i></button>
            <button class="sh-x" title="X / Twitter" onclick="shareTo('x')"><i class="fa-brands fa-twitter"></i></button>
            <button class="sh-cp" title="Salin tautan" onclick="shareTo('cp')"><i class="fas fa-link"></i></button>
          </div>
          </div>`;
      });
      exportRows.push({
        'No': 0,
        'Tanggal': isNaN(dt) ? '' : dt.toISOString().slice(0,10),
        'Jam (WIB)': isNaN(dt) ? '' : dt.toISOString().slice(11,16),
        'Latitude': +d.latitude.toFixed(4),
        'Longitude': +d.longitude.toFixed(4),
        'Kabupaten/Kota': d.kabupaten ? String(d.kabupaten) : '',
        'Provinsi': d.provinsi ? String(d.provinsi) : '',
        'Satelit': satName,
        'Kepercayaan': confLabel(d.confidence),
        'Energi (MW)': +(Number(d.frp) || 0).toFixed(1),
        'Suhu (°C)': tb ? +(tb - 273.15).toFixed(1) : '',
        'Jumlah Deteksi': det || '',
        'Wilayah': inAceh(d.latitude, d.longitude) ? 'Aceh' : 'Luar Aceh',
        'Google Maps': `https://www.google.com/maps?q=${d.latitude},${d.longitude}`
      });
      if (inAceh(d.latitude, d.longitude)) acehLayer.addLayer(m); else markers.push(m);
    });

    fireLayer.addLayers(markers);
    $('count-val').innerText = seen.size;
    exportRows.sort((x, y) => (y['Tanggal'] + y['Jam (WIB)']).localeCompare(x['Tanggal'] + x['Jam (WIB)']) || y['Energi (MW)'] - x['Energi (MW)']);
    exportRows.forEach((r, i) => r['No'] = i + 1);
    lastRows = exportRows;
    if (map.hasLayer(hwLayer)) hwLayer.eachLayer(l => l.bringToBack());   // titik NASA baru ditambahkan: Himawari tetap di belakang
    if (failed.length) showError(failed[0].error || undefined);
    if (fly) flyToRegion(region);
  } catch(e) {
    console.error(e); showError();
  } finally {
    if (token === renderToken) icon.classList.remove('fa-spin');
    loadDone();
  }
}

// Script ada di akhir <body>, jadi DOM sudah siap: tidak perlu menunggu window.onload (menunggu semua gambar peta).
(async () => {
  setLang(initLang());
  $('region-sel').value = 'indonesia';   // jaga-jaga jika browser mengembalikan pilihan lama
  applyUrlParams();                      // ?maps=... menimpa tampilan awal dan pilihan di atas

  // 1) mulai ambil data segar dari server SEKARANG, tanpa menunggu cek cache perangkat
  const pa = fetchRegion('aceh'), pi = fetchRegion('indonesia');
  // 2) cek cache di perangkat bersamaan
  const [ca, ci] = await Promise.all([cacheGet('aceh'), cacheGet('indonesia')]);
  store.aceh = ca ? Promise.resolve(parseRaw(ca)) : pa;
  store.indonesia = ci ? Promise.resolve(parseRaw(ci)) : pi;

  if (ca || ci) {
    // ada cache: langsung tampil, lalu diperbarui diam-diam setelah data segar tiba
    loadStart('upd');   // bar tetap tampil selama data segar diunduh di latar belakang
    fetchData(false);
    const swap = (r, p) => p.then(res => { if (res.rows) { store[r] = p; return true; } return false; });
    Promise.all([swap('aceh', pa), swap('indonesia', pi)]).then(ok => {
      (ok.some(Boolean) ? fetchData(false) : Promise.resolve()).finally(loadDone);
    });
  } else {
    // kunjungan pertama: Aceh tampil begitu siap, lalu Indonesia
    loadStart('dl');    // bar tetap tampil sampai data Indonesia selesai digambar
    fetchData(false, false, true);
    pi.then(() => fetchData(false)).finally(loadDone);
  }
})();
</script>
