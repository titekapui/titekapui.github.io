
name: Data titik api (FIRMS)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firms
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Fetch and process FIRMS data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          python scripts/firms.py

      - name: Publish data to branch data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if [ ! -d "out" ]; then
            echo "ERROR: Folder out tidak ditemukan."
            echo "Periksa lokasi keluaran scripts/firms.py."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Simpan hasil pengolahan sebelum berpindah branch.
          TEMP_DIR="$(mktemp -d)"
          cp -a out/. "$TEMP_DIR/"

          # Siapkan branch data dari remote.
          git fetch origin data || true

          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi

          # Ganti isi branch data dengan hasil terbaru.
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" -exec rm -rf {} +

          cp -a "$TEMP_DIR"/. .

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
            exit 0
          fi

          git commit -m "Update FIRMS data $(date -u +%Y-%m-%dT%H:%MZ)"

          # Kirim commit ke GitHub.
          git push origin data

          echo "Data FIRMS berhasil dipublikasikan ke branch data."
