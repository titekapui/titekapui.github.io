
name: Data titik api (FIRMS)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firms-data-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout kode utama
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ambil data lama dari branch data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --no-tags origin data
            git archive origin/data | tar -x -C out
          else
            echo "Branch data belum ada."
          fi

      - name: Bangun data FIRMS dan keluaran Himawari
        shell: bash
        env:
          GEO_BUDGET: "240"
          HW_GEO_BUDGET: "150"
        run: |
          set -euo pipefail

          python scripts/firms.py out

          python scripts/himawari_csv.py \
            himawari/hotspots.geojson \
            out/himawari/hotspots.csv

          python scripts/himawari_wilayah.py \
            himawari/hotspots-ringan.json \
            out/himawari/hotspots-wilayah.json \
            out/himawari/places.json

          test -s out/firms/aceh.csv
          test -s out/firms/indonesia.csv
          test -s out/firms/global.csv
          test -s out/firms/titik_api.csv
          test -s out/firms/meta.json
          test -s out/firms/places.json

          echo "Berkas FIRMS siap diterbitkan:"
          ls -lh out/firms/

          if [ -s out/himawari/hotspots.csv ]; then
            echo "CSV Himawari tersedia."
          else
            echo "Peringatan: CSV Himawari tidak dibuat pada putaran ini."
          fi

      - name: Terbitkan ke branch data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git -C out init -q -b data
          git -C out config user.name "github-actions[bot]"
          git -C out config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C out add -A

          if git -C out diff --cached --quiet; then
            echo "Tidak ada perubahan data."
            exit 0
          fi

          git -C out commit -q \
            -m "Perbarui data FIRMS $(date -u +%Y-%m-%dT%H:%MZ)"

          git -C out remote add publish \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git -C out push --force publish HEAD:refs/heads/data

          echo "Data berhasil diterbitkan ke branch data."
