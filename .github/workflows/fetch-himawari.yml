
name: Fetch Himawari Data

on:
  # Jalankan otomatis setiap 10 menit (UTC).
  schedule:
    - cron: "*/10 * * * *"

  # Izinkan menjalankan workflow secara manual.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: himawari
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Fetch and process Himawari data
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -e
          python himawari/fetch_himawari.py

      - name: Check generated data
        run: |
          set -e
          if [ ! -f "himawari/hotspots.geojson" ]; then
            echo "ERROR: himawari/hotspots.geojson tidak ditemukan."
            echo "Periksa lokasi output skrip fetch_himawari.py."
            exit 1
          fi

          echo "File GeoJSON ditemukan."
          ls -lh himawari/hotspots.geojson

      - name: Commit and push updated data
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add himawari/

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data Himawari."
            exit 0
          fi

          git commit -m "Update Himawari data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:${GITHUB_REF_NAME}

          echo "Data Himawari berhasil dikirim ke GitHub."
