
name: Ambil titik api Himawari

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-himawari-main
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout kode utama
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unduh dan gabungkan data
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_BASE: ${{ vars.FTP_BASE || '/pub/himawari/L2/WLF' }}
          HOURS: ${{ vars.HOURS || '24' }}
          BBOX: ${{ vars.BBOX || '94,-12,142,7' }}
        run: |
          set -euo pipefail

          python himawari/fetch_himawari.py

          test -s himawari/hotspots.geojson
          test -s himawari/hotspots-ringan.json

          ls -lh \
            himawari/hotspots.geojson \
            himawari/hotspots-ringan.json

      - name: Simpan data Himawari ke branch utama
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            himawari/hotspots.geojson \
            himawari/hotspots-ringan.json

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data Himawari."
            exit 0
          fi

          git commit \
            -m "Perbarui data Himawari $(date -u +%Y-%m-%dT%H:%MZ)"

          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" &&
               git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Data Himawari berhasil dikirim ke GitHub."
              exit 0
            fi

            echo "Percobaan push $i gagal; mencoba lagi..."
            sleep 5
          done

          echo "Gagal push setelah 3 percobaan."
          exit 1
